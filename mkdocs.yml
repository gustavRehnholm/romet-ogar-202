site_name: Romet Ogar 202
site_url: https://ogar202.github.io/

theme:
  name: material
  language: sv
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top

nav:
  - Hem: index.md

  - Mopeden:
      - Översikt: mopeden/index.md
      - Specifikationer: mopeden/specifikationer.md
      - Delar och dimensioner: mopeden/delar-och-dimensioner.md
      - Manualer och källor: mopeden/manualer-och-kallor.md

  - Service:
      - Översikt: service/index.md
      - Serviceintervall: service/serviceintervall.md

      - Motor:
          - Motorolja: service/motorolja.md
          - Tändstift: service/tandstift.md
          - Ventilspel: service/ventilspel.md
          - Luftfilter: service/luftfilter.md
          - Avgassystem: service/avgassystem.md

      - Bränslesystem:
          - Bränslesystem / tomgång: service/branslesystem-tomgang.md
          - Bränslefilter: service/branslefilter.md

      - Drivlina:
          - Koppling: service/koppling.md
          - Kedja: service/kedja.md

      - Bromsar och chassi:
          - Bromskontroll: service/bromskontroll.md
          - Hjul, styrning och fjädring: service/hjul-styrning-fjadring.md

      - Elsystem: service/elsystem.md
      - Allmän kontroll: service/allman-kontroll.md

  - Felsökning:
      - Översikt: felsokning/index.md
      - Onormala motorljud: felsokning/motorljud.md
      - Startproblem: felsokning/startproblem.md
      - Vibrationer: felsokning/vibrationer.md

  - den här mopeden:
      - Översikt: den-har-mopeden/index.md
      - Servicejournal: den-har-mopeden/servicejournal.md
      - Reservdelsinventarium: den-har-mopeden/reservdelsinventarium.md
